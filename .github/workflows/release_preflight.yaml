name: Release Preflight
on:
  workflow_dispatch:
    inputs:
      expected_tag:
        description: Release tag expected from pyproject.toml
        required: true
        default: v0.7.0
        type: string

permissions:
  contents: read

concurrency:
  group: release-preflight-master
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: master
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"
      - name: Install Poetry
        run: python -m pip install "poetry==2.4.1"
      - name: Install dependencies
        run: poetry install
      - name: Run release preflight
        run: >-
          poetry run python scripts/release_preflight.py
          "${{ inputs.expected_tag }}"
          --target-ref HEAD
          --master-ref origin/master
