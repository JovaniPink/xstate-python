name: Release Preflight
on:
  workflow_dispatch:
    inputs:
      expected_tag:
        description: Release tag expected from pyproject.toml
        required: true
        default: v0.7.0
        type: string

permissions:
  contents: read

concurrency:
  group: release-preflight-master
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          submodules: recursive
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install Poetry
        run: python -m pip install "poetry>=2.0,<3.0"
      - name: Install dependencies
        run: poetry install
      - name: Run release preflight
        run: >-
          poetry run python scripts/release_preflight.py
          "${{ inputs.expected_tag }}"
          --target-ref HEAD
          --master-ref origin/master
