name: Run tests and code quality

on:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14"]
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Poetry
        run: python -m pip install "poetry==2.4.1"
      - name: Install dependencies
        run: poetry install
      - name: Run tests
        run: poetry run pytest tests/ --ignore=tests/test_scxml.py --cov --cov-report=xml
  scxml-smoke:
    name: SCXML smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"
      - name: Install Poetry
        run: python -m pip install "poetry==2.4.1"
      - name: Install dependencies
        run: poetry install
      - name: Run SCXML smoke suite
        run: poetry run python -m pytest tests/test_scxml.py -m scxml_ci
  code-quality:
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.14"]
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Poetry
        run: python -m pip install "poetry==2.4.1"
      - name: Install dependencies
        run: poetry install
      - name: Check formatting
        run: poetry run ruff format --check src/ tests/ scripts/ docs/examples/
      - name: Run lint
        run: poetry run ruff check src/ tests/ scripts/ docs/examples/
      - name: Run type checks
        run: poetry run mypy src/xstate/
      - name: Check package metadata
        run: poetry check --lock
      - name: Build and validate distribution
        run: |
          poetry build
          poetry run python scripts/validate_distribution.py
