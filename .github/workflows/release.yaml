name: Release
on:
  release:
    types:
      - published

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  publish:
    if: ${{ !github.event.release.draft && !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Check PyPI token
        env:
          POETRY_PYPI_TOKEN_PYPI: ${{ secrets.PYPI_TOKEN }}
        run: |
          if [ -z "$POETRY_PYPI_TOKEN_PYPI" ]; then
            echo "::error::PYPI_TOKEN secret is not configured or is empty."
            exit 1
          fi
      - name: Install Poetry
        run: python -m pip install "poetry>=2.0,<3.0"
      - name: Install dependencies
        run: poetry install
      - name: Run release preflight
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: >-
          poetry run python scripts/release_preflight.py
          "$RELEASE_TAG"
          --target-ref "$RELEASE_TAG"
          --master-ref origin/master
      - name: Publish to PyPI
        env:
          POETRY_PYPI_TOKEN_PYPI: ${{ secrets.PYPI_TOKEN }}
        run: poetry publish
