name: Release
on:
  release:
    types:
      - published

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      ${{
        !github.event.release.draft &&
        !github.event.release.prerelease &&
        vars.PYPI_PUBLISH_ENABLED == 'true'
      }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"
      - name: Check PyPI token
        env:
          POETRY_PYPI_TOKEN_PYPI: ${{ secrets.PYPI_TOKEN }}
        run: |
          if [ -z "$POETRY_PYPI_TOKEN_PYPI" ]; then
            echo "::error::PYPI_TOKEN secret is not configured or is empty."
            exit 1
          fi
      - name: Install Poetry
        run: python -m pip install "poetry==2.4.1"
      - name: Install dependencies
        run: poetry install
      - name: Run release preflight
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: >-
          poetry run python scripts/release_preflight.py
          "$RELEASE_TAG"
          --target-ref "$RELEASE_TAG"
          --master-ref origin/master
      - name: Publish to PyPI
        env:
          POETRY_PYPI_TOKEN_PYPI: ${{ secrets.PYPI_TOKEN }}
        run: poetry publish
